esphome:
  name: litter-robot-esp32
  friendly_name: "Litter Robot ESP32"
  on_boot:
    priority: -10
    then:
      - output.turn_off: fake_gnd_pinch
      - script.execute: stop_motor
      - switch.template.publish:
          id: switch_forward
          state: OFF
      - switch.template.publish:
          id: switch_reverse
          state: OFF
      - script.execute: repeated_clean_timer_loop
      - script.execute: sample_baseline_weight


esp32:
  board: nodemcu-32s
  framework:
    type: arduino

wifi:
  ssid: [wifi id]
  password: [wifi pass]
  ap:
    ssid: "Litter-Robot Fallback"
    password: "changeme123"

captive_portal:

logger:
  level: INFO

api:
  reboot_timeout: 0s

ota:
  platform: esphome

web_server:
  port: 80
  version: 3
  auth:
    type: digest
    username: glow
    password: !secret litter_robot_esp32__web_password

i2c:
  sda: GPIO21
  scl: GPIO22
  scan: true

# ----------------------------------------
# BACKGROUND MEMORY FOR STATISTICS & TIMERS
# ----------------------------------------
globals:
  - id: global_clean_counter
    type: int
    restore_value: true
    initial_value: '0'
    
  - id: repeated_timer_ms
    type: uint32_t
    restore_value: true
    initial_value: '0'

  - id: baseline_weight
    type: float
    initial_value: '0.0'

  - id: baseline_sampled
    type: bool
    initial_value: 'false'

  - id: last_cat_weight
    type: float
    initial_value: '0.0'

# ----------------------------------------
# 1. MOTOR DRIVER PWM OUTPUTS
# ----------------------------------------
output:
  - platform: ledc
    pin: GPIO19
    id: motor_in1
    max_power: 0.80

  - platform: ledc
    pin: GPIO18
    id: motor_in2
    max_power: 0.80

  - platform: gpio
    pin: GPIO25
    id: fake_gnd_pinch

# ----------------------------------------
# 2. MOTOR CONTROL SCRIPTS
# ----------------------------------------
script:
  - id: sample_baseline_weight
    then:
      - delay: 10s
      - lambda: |-
          id(baseline_weight) = id(cat_weight_sensor).state;
          id(baseline_sampled) = true;
          ESP_LOGI("main", "Baseline weight sampled: %.3f V", id(baseline_weight));
      - sensor.template.publish:
          id: weight_baseline_display
          state: !lambda 'return id(baseline_weight);'

  - id: cycle_forward
    then:
      - output.set_level:
          id: motor_in1
          level: 100%
      - output.set_level:
          id: motor_in2
          level: 0%
      - output.turn_off: motor_in2

  - id: cycle_reverse
    then:
      - output.set_level:
          id: motor_in2
          level: 100%
      - output.set_level:
          id: motor_in1
          level: 0%
      - output.turn_off: motor_in1

  - id: stop_motor
    then:
      - output.set_level:
          id: motor_in1
          level: 0%
      - output.set_level:
          id: motor_in2
          level: 0%
      - output.turn_off: motor_in1
      - output.turn_off: motor_in2

  - id: clean_cycle
    then:
      - switch.turn_on: switch_forward
      - wait_until:
          binary_sensor.is_on: hall_yellow
      - switch.turn_off: switch_forward
      - delay: 3s
      - switch.turn_on: switch_reverse
      - wait_until:
          binary_sensor.is_on: hall_orange
      - delay: 11s
      - switch.turn_off: switch_reverse
      - delay: 3s
      - switch.turn_on: switch_forward
      - wait_until:
          binary_sensor.is_on: hall_orange
      - switch.turn_off: switch_forward
      - script.execute: repeated_clean_timer_loop

  - id: dump_litter_routine
    then:
      - switch.turn_on: switch_reverse
      - wait_until:
          binary_sensor.is_on: hall_yellow
      - delay: 7s
      - switch.turn_off: switch_reverse

  - id: dump_to_home_routine
    then:
      - switch.turn_on: switch_forward
      - wait_until:
          binary_sensor.is_on: hall_orange
      - switch.turn_off: switch_forward

  - id: check_dfi
    then:
      - if:
          condition:
            lambda: 'return id(dfi_distance).state <= id(dfi_trip_distance).state;'
          then:
            - logger.log:
                level: INFO
                format: "Drawer Full Indicator tripped at %.3f m"
                args: [ 'id(dfi_distance).state' ]
            - binary_sensor.template.publish:
                id: dfi_full
                state: ON
            - switch.turn_on: master_disable
          else:
            - binary_sensor.template.publish:
                id: dfi_full
                state: OFF

  # Master Countdown Manager
  - id: cancel_countdown
    then:
      - script.stop: automated_clean_countdown
      - script.stop: repeated_clean_timer_loop
      - binary_sensor.template.publish:
          id: countdown_active
          state: OFF

  - id: automated_clean_countdown
    mode: restart
    then:
      - script.execute: check_dfi
      - script.wait: check_dfi
            
      - binary_sensor.template.publish:
          id: countdown_active
          state: ON
      
      - delay: !lambda "return (uint32_t)(id(delay_timer_minutes).state * 60000);"

      - globals.set:
          id: global_clean_counter
          value: !lambda 'return id(global_clean_counter) + 1;'

      - sensor.template.publish:
          id: clean_counter_display
          state: !lambda 'return id(global_clean_counter);'

      - logger.log:
          level: INFO
          format: "Cleaning cycle triggered: Weight Sensor. Baseline was %.3f V, trigger was %.3f V"
          args: [ 'id(baseline_weight)', 'id(last_cat_weight)' ]

      - script.execute: clean_cycle
      
      - script.execute: check_dfi
      
      - binary_sensor.template.publish:
          id: countdown_active
          state: OFF

  # Repeated Timer Loop
  - id: repeated_clean_timer_loop
    mode: restart
    then:
      - if:
          condition:
            and:
              - lambda: 'return id(repeated_timer_ms) > 0;'
              - switch.is_off: master_disable
          then:
            - delay: !lambda 'return id(repeated_timer_ms);'
            - logger.log:
                level: INFO
                format: "Cleaning cycle triggered: Regular Cycle"
            - script.execute: clean_cycle

# ----------------------------------------
# 3. MANUAL OVERRIDE SWITCHES
# ----------------------------------------
switch:
  - platform: template
    name: "Master Disable"
    id: master_disable
    icon: "mdi:power-plug-off"
    entity_category: config
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    turn_on_action:
      - switch.template.publish:
          id: master_disable
          state: ON
      # Stop any current countdown immediately
      - script.execute: cancel_countdown
    turn_off_action:
      - switch.template.publish:
          id: master_disable
          state: OFF
      # Restart the timer loops when turned back on
      - script.execute: repeated_clean_timer_loop

  - platform: template
    name: "Action: Spin Forward"
    id: switch_forward
    turn_on_action:
      - script.execute: cancel_countdown
      - switch.turn_off: switch_reverse
      - script.execute: cycle_forward
      - switch.template.publish:
          id: switch_forward
          state: ON
    turn_off_action:
      - script.execute: stop_motor
      - switch.template.publish:
          id: switch_forward
          state: OFF

  - platform: template
    name: "Action: Spin Reverse"
    id: switch_reverse
    turn_on_action:
      - script.execute: cancel_countdown
      - switch.turn_off: switch_forward
      - script.execute: cycle_reverse
      - switch.template.publish:
          id: switch_reverse
          state: ON
    turn_off_action:
      - script.execute: stop_motor
      - switch.template.publish:
          id: switch_reverse
          state: OFF

# ----------------------------------------
# 4. BUTTONS (UI Controls & System)
# ----------------------------------------
button:
  - platform: template
    name: "Action: Clean Cycle"
    id: button_clean
    on_press:
      - script.execute: cancel_countdown
      - logger.log:
          level: INFO
          format: "Cleaning cycle triggered: Manual"
      - script.execute: clean_cycle

  - platform: template
    name: "Action: Dump Litter"
    id: button_dump_litter
    on_press:
      - script.execute: cancel_countdown
      - script.execute: dump_litter_routine

  - platform: template
    name: "Action: Dump Reset"
    id: button_dump_to_home
    icon: "mdi:alert"
    on_press:
      - script.execute: cancel_countdown
      - script.execute: dump_to_home_routine

  - platform: template
    name: "Action: Stop Motor"
    id: button_stop
    icon: "mdi:stop-circle-outline"
    on_press:
      - script.execute: cancel_countdown
      - script.stop: clean_cycle
      - script.stop: dump_litter_routine
      - script.stop: dump_to_home_routine
      - script.execute: stop_motor
      - switch.template.publish:
          id: switch_forward
          state: OFF
      - switch.template.publish:
          id: switch_reverse
          state: OFF

  - platform: restart
    name: "Reboot ESP32"
    entity_category: diagnostic

# ----------------------------------------
# 5. CONFIGURATION & TIMER SETTINGS
# ----------------------------------------
number:
  - platform: template
    name: "DFI Trip <= (m)"
    id: dfi_trip_distance
    icon: "mdi:ruler"
    entity_category: config
    min_value: 0.04
    max_value: 0.30
    step: 0.01
    initial_value: 0.20
    optimistic: true
    restore_value: true

  - platform: template
    name: "Clean Delay (mins)"
    id: delay_timer_minutes
    icon: "mdi:timer-outline"
    entity_category: config
    min_value: 2
    max_value: 20
    step: 1
    initial_value: 7
    optimistic: true
    restore_value: true

  - platform: template
    name: "Weight Trigger (V)"
    id: weight_trigger_delta
    icon: "mdi:scale-balance"
    entity_category: config
    min_value: 0.01
    max_value: 0.20
    step: 0.01
    initial_value: 0.05
    optimistic: true
    restore_value: true

select:
  - platform: template
    name: "Regular Clean (h)"
    id: repeated_clean_interval
    icon: "mdi:history"
    entity_category: config
    options:
      - "Disabled"
      - "1"
      - "2"
      - "3"
      - "6"
      - "12"
      - "18"
      - "24"
    initial_option: "Disabled"
    optimistic: true
    restore_value: true
    on_value:
      - lambda: |-
          uint32_t hours = 0;
          if (x == "1") hours = 1;
          else if (x == "2") hours = 2;
          else if (x == "3") hours = 3;
          else if (x == "6") hours = 6;
          else if (x == "12") hours = 12;
          else if (x == "18") hours = 18;
          else if (x == "24") hours = 24;
          id(repeated_timer_ms) = hours * 3600000;
      - script.execute: repeated_clean_timer_loop

# ----------------------------------------
# 6. ANALOG SENSORS (Weight & Triggers)
# ----------------------------------------
sensor:
  - platform: vl53l0x
    name: "Sensor: DFI"
    id: dfi_distance
    update_interval: 5s

  - platform: adc
    pin: GPIO32
    id: cat_weight_sensor
    name: "Sensor: Weight"
    update_interval: 0.1s
    attenuation: 12db
    filters:
      - sliding_window_moving_average:
          window_size: 10
          send_every: 5
    
    on_value:
      # CONDITION 1: Cat is present (Voltage deviates from baseline)
      - if:
          condition:
            lambda: |-
              if (!id(baseline_sampled)) return false;
              return abs(x - id(baseline_weight)) > id(weight_trigger_delta).state;
          then:
            - if:
                condition:
                  switch.is_off: master_disable
                then:
                  - if:
                      condition:
                        binary_sensor.is_off: cat_present
                      then:
                        - globals.set:
                            id: last_cat_weight
                            value: !lambda 'return x;'
                        - binary_sensor.template.publish:
                            id: cat_present
                            state: ON
                        - script.execute: cancel_countdown
                        - script.stop: clean_cycle
                        - script.stop: dump_litter_routine
                        - script.stop: dump_to_home_routine
                        - script.execute: stop_motor
                        - switch.template.publish:
                            id: switch_forward
                            state: OFF
                        - switch.template.publish:
                            id: switch_reverse
                            state: OFF

      # CONDITION 2: Box is Empty / Resting State
      - if:
          condition:
            lambda: |-
              if (!id(baseline_sampled)) return false;
              return abs(x - id(baseline_weight)) <= id(weight_trigger_delta).state;
          then:
            - if:
                condition:
                  switch.is_off: master_disable
                then:
                  - if:
                      condition:
                        binary_sensor.is_on: cat_present
                      then:
                        - binary_sensor.template.publish:
                            id: cat_present
                            state: OFF
                        - script.execute: automated_clean_countdown

  # Clean Read-Only Display for the Counter
  - platform: template
    name: "Stat: Cleaned Count"
    id: clean_counter_display
    icon: "mdi:counter"
    accuracy_decimals: 0
    update_interval: 10s
    lambda: 'return id(global_clean_counter);'

  # Read-Only Display for Weight Baseline
  - platform: template
    name: "Weight Baseline (V)"
    id: weight_baseline_display
    icon: "mdi:scale-balance"
    accuracy_decimals: 3
    entity_category: diagnostic
    update_interval: 10s
    lambda: |-
      if (id(baseline_sampled)) {
        return id(baseline_weight);
      } else {
        return NAN;
      }
# ----------------------------------------
# 7. DIGITAL SENSORS & UI STATUS
# ----------------------------------------
binary_sensor:
  - platform: template
    name: "Status: DFI Full"
    id: dfi_full
    device_class: problem

  # Virtual UI Indicator: Is the cat inside?
  - platform: template
    name: "Status: Cat Present"
    id: cat_present
    device_class: occupancy

  # Virtual UI Indicator: Is the timer running?
  - platform: template
    name: "Status: Countdown"
    id: countdown_active
    device_class: running

  # Hall Effect Sensor (Dump Position)
  - platform: gpio
    pin:
      number: GPIO16
      mode: INPUT_PULLUP
      inverted: true
    name: "Sensor: Pos Dump"
    id: hall_yellow
    device_class: window 

  # Hall Effect Sensor (Home Position)
  - platform: gpio
    pin:
      number: GPIO17
      mode: INPUT_PULLUP
      inverted: true
    name: "Sensor: Pos Home"
    id: hall_orange
    device_class: window

  # Pinch Sensor (Safety Interrupt)
  - platform: gpio
    pin:
      number: GPIO26
      mode: INPUT_PULLUP
    name: "Sensor: Pinch Switch"
    id: pinch_sensor
    device_class: safety
    on_press:
      - if:
          condition:
            switch.is_on: switch_reverse
          then:
            - script.execute: cancel_countdown
            - script.stop: clean_cycle
            - script.stop: dump_litter_routine
            - script.stop: dump_to_home_routine
            - switch.turn_off: switch_reverse
            - switch.turn_on: switch_forward
            - delay: 1.5s
            - switch.turn_off: switch_forward